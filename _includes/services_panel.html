<div id="services-wrapper" class="ed-section ed-services">
  <div id="services-main">
    <h2>Academic Services</h2>

    <ul class="ed-pub-list" id="services-bars">
      <li class="ed-pub-row category-bar" data-category="area_chair">
        <span class="ed-pub-row-title">Area Chair</span>
        <span class="ed-pub-row-count">1</span>
        <span class="ed-pub-row-arrow" aria-hidden="true">→</span>
      </li>
      <li class="ed-pub-row category-bar" data-category="conference_reviewer">
        <span class="ed-pub-row-title">Conference Reviewer / PC Member</span>
        <span class="ed-pub-row-count">12</span>
        <span class="ed-pub-row-arrow" aria-hidden="true">→</span>
      </li>
      <li class="ed-pub-row category-bar" data-category="journal_reviewer">
        <span class="ed-pub-row-title">Journal Reviewer</span>
        <span class="ed-pub-row-count">10</span>
        <span class="ed-pub-row-arrow" aria-hidden="true">→</span>
      </li>
    </ul>
  </div>

  <aside id="services-panel" class="ed-pub-panel" aria-hidden="true">
    <div class="ed-pub-panel-head">
      <button type="button" class="ed-pub-panel-back" id="services-back-btn">← Back</button>
      <span class="ed-pub-panel-title" id="services-panel-title-text"></span>
      <span class="ed-pub-panel-count"><span id="services-panel-count-num">0</span> venues</span>
    </div>
    <div class="ed-pub-panel-body">
      <p class="ed-pub-panel-desc" id="services-panel-description"></p>
      <ul class="ed-venues-list" id="services-venues-list"></ul>
    </div>
  </aside>
</div>

<script>
window.servicesData = {
  area_chair: {
    title: "Area Chair",
    description: "Conference Area Chair responsibilities.",
    venues: [
      { name: "IJCNN 2025", full: "International Joint Conference on Neural Networks", link: "https://2025.ijcnn.org/" }
    ]
  },
  conference_reviewer: {
    title: "Conference Reviewer / PC Member",
    description: "Conference reviewer and program committee member.",
    venues: [
      { name: "NeurIPS", full: "Neural Information Processing Systems", years: "2023 – 2026", link: "https://neurips.cc/" },
      { name: "ICML",    full: "International Conference on Machine Learning", years: "2024 – 2026", link: "https://icml.cc/" },
      { name: "ICLR",    full: "International Conference on Learning Representations", years: "2024 – 2026", link: "https://iclr.cc/" },
      { name: "AAAI",    full: "AAAI Conference on Artificial Intelligence", years: "2024 – 2026", link: "https://www.aaai.org/" },
      { name: "IJCAI",   full: "International Joint Conference on Artificial Intelligence", years: "2023 – 2026", link: "https://www.ijcai.org/" },
      { name: "CVPR",    full: "Computer Vision and Pattern Recognition", years: "2024 – 2026", link: "https://cvpr.thecvf.com/" },
      { name: "ECCV",    full: "European Conference on Computer Vision", years: "2024, 2026", link: "https://eccv.ecva.net/" },
      { name: "MICCAI",  full: "Medical Image Computing and Computer Assisted Intervention", years: "2024 – 2026", link: "https://miccai.org/" },
      { name: "KDD",     full: "ACM SIGKDD Conference on Knowledge Discovery and Data Mining", years: "2024 – 2026", link: "https://www.kdd.org/" },
      { name: "ECAI",    full: "European Conference on Artificial Intelligence", years: "2024 – 2026", link: "https://ecai2024.eu/" },
      { name: "ICASSP",  full: "IEEE Int. Conf. on Acoustics, Speech and Signal Processing", years: "2024 – 2026", link: "https://2025.ieeeicassp.org/" },
      { name: "ICME",    full: "IEEE Int. Conf. on Multimedia and Expo", years: "2024 – 2026", link: "https://2025.ieee-icme.org/" }
    ]
  },
  journal_reviewer: {
    title: "Journal Reviewer",
    description: "Journal review responsibilities.",
    venues: [
      { name: "JMLR",   full: "Journal of Machine Learning Research", link: "https://www.jmlr.org/" },
      { name: "TPAMI",  full: "IEEE Transactions on Pattern Analysis and Machine Intelligence", link: "https://ieeexplore.ieee.org/xpl/RecentIssue.jsp?punumber=34" },
      { name: "TNNLS",  full: "IEEE Transactions on Neural Networks and Learning Systems", link: "https://ieeexplore.ieee.org/xpl/RecentIssue.jsp?punumber=5962385" },
      { name: "TKDE",   full: "IEEE Transactions on Knowledge and Data Engineering", link: "https://ieeexplore.ieee.org/xpl/RecentIssue.jsp?punumber=69" },
      { name: "TGRS",   full: "IEEE Transactions on Geoscience and Remote Sensing", link: "https://ieeexplore.ieee.org/xpl/RecentIssue.jsp?punumber=36" },
      { name: "TETC",   full: "IEEE Transactions on Emerging Topics in Computing", link: "https://ieeexplore.ieee.org/xpl/RecentIssue.jsp?punumber=6877122" },
      { name: "KBS",    full: "Knowledge-Based Systems", link: "https://www.sciencedirect.com/journal/knowledge-based-systems" },
      { name: "AIM",    full: "Artificial Intelligence in Medicine", link: "https://www.sciencedirect.com/journal/artificial-intelligence-in-medicine" },
      { name: "Information Systems", full: "Information Systems (Elsevier)", link: "https://www.sciencedirect.com/journal/information-systems" },
      { name: "Computer Networks", full: "Computer Networks (Elsevier)", link: "https://www.sciencedirect.com/journal/computer-networks" }
    ]
  }
};

document.addEventListener('DOMContentLoaded', function() {
  var panel = document.getElementById('services-panel');
  var backBtn = document.getElementById('services-back-btn');
  var bars = document.querySelectorAll('#services-bars .category-bar');

  bars.forEach(function(bar) {
    bar.addEventListener('click', function() {
      openServicesPanel(this.getAttribute('data-category'));
    });
  });

  backBtn.addEventListener('click', closeServicesPanel);

  document.addEventListener('keydown', function(ev) {
    if (ev.key === 'Escape' && panel.classList.contains('active')) {
      closeServicesPanel();
    }
  });

  document.addEventListener('click', function(ev) {
    if (panel.classList.contains('active') &&
        !panel.contains(ev.target) &&
        !ev.target.closest('#services-bars .category-bar')) {
      closeServicesPanel();
    }
  });

  function openServicesPanel(category) {
    var data = window.servicesData[category];
    if (!data) return;

    document.getElementById('services-panel-title-text').textContent = data.title;
    document.getElementById('services-panel-count-num').textContent = data.venues.length;
    document.getElementById('services-panel-description').textContent = data.description || '';

    var list = document.getElementById('services-venues-list');
    list.innerHTML = '';

    data.venues.forEach(function(venue) {
      var li = document.createElement('li');
      li.className = 'ed-venue';

      var html = '<span class="ed-venue-name">';
      if (venue.link) {
        html += '<a href="' + venue.link + '" target="_blank">' + venue.name + '</a>';
      } else {
        html += venue.name;
      }
      html += '</span>';

      if (venue.full) {
        html += '<span class="ed-venue-full">' + venue.full + '</span>';
      }
      if (venue.years) {
        html += '<span class="ed-venue-years">' + venue.years + '</span>';
      }

      li.innerHTML = html;
      list.appendChild(li);
    });

    panel.classList.add('active');
    panel.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }

  function closeServicesPanel() {
    panel.classList.remove('active');
    panel.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }
});
</script>

<style>
  .ed-venues-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .ed-venue {
    display: grid;
    grid-template-columns: 130px 1fr auto;
    gap: 16px;
    padding: 14px 0;
    border-bottom: 1px dotted #e5e7eb;
    align-items: baseline;
  }

  .ed-venue:first-child { padding-top: 0; }
  .ed-venue:last-child { border-bottom: none; }

  .ed-venue-name {
    font-weight: 700;
    color: #0a0a0a;
    font-size: 0.96rem;
  }

  .ed-venue-name a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }

  .ed-venue-name a:hover {
    border-bottom-color: #0a0a0a;
  }

  .ed-venue-full {
    color: #4b5563;
    font-size: 0.92rem;
    font-style: italic;
  }

  .ed-venue-years {
    color: #6b7280;
    font-size: 0.84rem;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  @media (max-width: 600px) {
    .ed-venue {
      grid-template-columns: 1fr;
      gap: 3px;
    }
  }

  @media (prefers-color-scheme: dark) {
    .ed-venue { border-bottom-color: #292929; }
    .ed-venue-name { color: #fafafa; }
    .ed-venue-name a:hover { border-bottom-color: #fafafa; }
    .ed-venue-full { color: #d4d4d4; }
    .ed-venue-years { color: #9ca3af; }
  }
</style>
